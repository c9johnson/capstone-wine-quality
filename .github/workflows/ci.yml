name: Wine Quality CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Data Exists
        run: |
          mkdir -p data
          # Pull down the public UCI red and white wine CSVs and combine them 
          # so data/winequality.csv is ready for preprocess.py
          curl -s "https://archive.ics.uci.edu/static/public/186/wine+quality.zip" -o wine.zip
          unzip -q wine.zip
          unzip -q "winequality.zip"
          python -c "
          import pandas as pd
          red = pd.read_csv('winequality-red.csv', sep=';')
          red['wine_type'] = 'red'
          white = pd.read_csv('winequality-white.csv', sep=';')
          white['wine_type'] = 'white'
          df = pd.concat([red, white], ignore_index=True)
          df.to_csv('data/winequality.csv', index=False)
          "

      - name: Run Pipeline and Tests
        run: |
          python src/train.py
          pytest